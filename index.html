<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda semanal</title>
<meta name="theme-color" content="#3b6fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#1f2330; --muted:#6b7080; --line:#e7e3da; --accent:#3b6fd8; --danger:#d23c3c; --ok:#1f9d6b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14161c; --card:#1e2129; --ink:#eef0f5; --muted:#9aa0b0; --line:#2c303a; --accent:#7ea3f0; --danger:#f07070; --ok:#4fcf9b; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px)
            calc(env(safe-area-inset-bottom) + 100px) calc(env(safe-area-inset-left) + 16px);
    max-width:520px;margin:0 auto;-webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .curso{font-size:.85rem;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
  .curso:empty{display:none}
  .icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:40px;height:40px;font-size:1.1rem;font-weight:800;flex:none;padding:0 10px}
  .icon-btn.lock{font-size:.85rem}
  .conn{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .conn.on{background:var(--ok)}
  .personas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
  .personas::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:800;font-size:.88rem}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.add{color:var(--muted);border-style:dashed}
  .tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
  .tab{font-weight:800;font-size:.95rem;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
  .tab small{font-size:.58rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .tab.hoy small{color:var(--accent)}
  .tab .n{position:absolute;top:3px;right:5px;font-size:.55rem;color:var(--muted);font-weight:800}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tab[aria-selected="true"] small,.tab[aria-selected="true"] .n{color:var(--bg);opacity:.75}
  h2{font-size:1.15rem;font-weight:800;margin:0 2px 10px}
  ol{list-style:none;display:flex;flex-direction:column;gap:8px}
  li.card{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative}
  .editor li.card{cursor:pointer}
  .editor li.card:active{transform:scale(.99)}
  .bar{width:5px;border-radius:4px;flex:none}
  .hora{flex:none;width:52px;font-weight:800;font-size:.95rem;line-height:1.25;font-variant-numeric:tabular-nums}
  .hora span{display:block;font-weight:600;font-size:.78rem;color:var(--muted)}
  .act{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
  .nombre{font-weight:800;font-size:1.02rem;line-height:1.2;overflow-wrap:anywhere}
  .tag{align-self:flex-start;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
  .emoji{font-size:1.5rem;align-self:center;flex:none}
  li.ahora{outline:2.5px solid var(--accent);outline-offset:-1px}
  li.ahora::after{content:"AHORA";position:absolute;top:-9px;right:14px;background:var(--accent);color:#fff;font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.06em}
  .vacio{text-align:center;color:var(--muted);padding:34px 10px;border:2px dashed var(--line);border-radius:16px;font-weight:700}
  .vacio div{font-size:2rem;margin-bottom:6px}
  .aviso{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;font-weight:700;line-height:1.45}
  .aviso b{display:block;font-size:1.1rem;margin-bottom:6px}
  .aviso code{font-size:.85rem;background:var(--bg);padding:1px 6px;border-radius:6px}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);background:var(--accent);color:#fff;border:none;border-radius:99px;padding:14px 26px;font-weight:800;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:5;display:none;white-space:nowrap}
  .editor .fab{display:block}
  .estado{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 84px);left:50%;transform:translateX(-50%);font-size:.85rem;font-weight:800;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:7px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:99px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  .estado.on{opacity:1}
  .velo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
  .velo.on{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;animation:sube .2s ease-out}
  @keyframes sube{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .sheet h3{font-size:1.15rem;font-weight:800;margin-bottom:14px}
  .sheet p.sub{color:var(--muted);font-weight:700;font-size:.9rem;margin:-8px 0 12px}
  label.f{display:block;font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
  input[type=text],input[type=time],input[type=password],input[type=date]{width:100%;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;-webkit-appearance:none}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opciones{display:flex;flex-wrap:wrap;gap:6px}
  .op{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-weight:800;font-size:.82rem}
  .op[aria-pressed="true"]{outline:2.5px solid currentColor;outline-offset:-1px}
  .op.gest{color:var(--muted);border-style:dashed;background:transparent}
  .emoji-sel{display:flex;gap:8px;align-items:center}
  .emoji-sel input{width:70px;text-align:center;font-size:1.3rem}
  .temas{display:flex;gap:5px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
  .temas::-webkit-scrollbar{display:none}
  .temas button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 10px;font-size:.75rem;font-weight:800}
  .temas button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin-top:8px}
  .emojis button{border:none;background:var(--bg);border-radius:10px;height:40px;font-size:1.25rem}
  .emojis button[aria-pressed="true"]{outline:2px solid var(--accent)}
  .colores{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .colores button{height:38px;border-radius:12px;border:none}
  .colores button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
  .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dias button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;font-weight:800}
  .dias button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .acciones{display:flex;gap:8px;margin-top:20px}
  .btn{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px;font-weight:800;font-size:1rem}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.peligro{color:var(--danger);border-color:var(--danger);background:transparent}
  .btn.peligro.armado{background:var(--danger);color:#fff}
  .menu .btn{display:block;width:100%;text-align:left;margin-bottom:8px}
  .tipos-lista{list-style:none;display:flex;flex-direction:column;gap:6px}
  .tipos-lista li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer}
  .tipos-lista .sw{width:14px;height:14px;border-radius:50%;flex:none}
  .tipos-lista .tn{flex:1;font-weight:800}
  .tipos-lista .tc{font-size:.75rem;color:var(--muted);font-weight:700}
  .err{color:var(--danger);font-size:.85rem;font-weight:700;margin-top:10px;min-height:1em}
  .err:empty{margin-top:0;min-height:0}
  .nota{color:var(--muted);font-size:.8rem;font-weight:700;margin-top:6px}
  .nota:empty{display:none}
  .mas1{font-size:.65rem;color:var(--accent);font-weight:800}
  .hora .ayer{font-size:.6rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
  /* Botones Guardar/Cancelar siempre visibles al pie de la hoja */
  .sheet:has(.pie){padding-bottom:0}
  .pie{position:sticky;bottom:0;background:var(--card);margin:18px -18px 0;padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line);display:flex;gap:8px;z-index:3}
  .pie .btn{padding:14px}
  .icono-actual{display:flex;align-items:center;gap:10px}
  .icono-actual .ic{font-size:1.7rem;width:54px;height:54px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .icono-actual button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;font-weight:800;font-size:.85rem}
  /* ---------- Tablet ---------- */
  @media (min-width: 640px){
    body{max-width:820px;padding-left:calc(env(safe-area-inset-left) + 28px);padding-right:calc(env(safe-area-inset-right) + 28px)}
    ol.dia{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .velo{align-items:center;padding:24px}
    .sheet{border-radius:22px;max-width:560px;max-height:88vh;padding-bottom:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .sheet:has(.pie){padding-bottom:0}
    .pie{padding-bottom:14px;border-radius:0 0 22px 22px}
    .fab{left:auto;right:max(28px, calc(50vw - 410px + 28px));transform:none}
    .estado{bottom:28px}
    li.card:hover{border-color:var(--muted)}
  }
  /* ---------- PC: semana completa ---------- */
  @media (min-width: 1000px){
    body{max-width:1500px;padding-top:24px}
    .fab{right:32px;bottom:28px}
    .estado{bottom:32px}
    .tabs{display:none}
    h2{font-size:1.3rem}
    .semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
    .col{background:color-mix(in srgb, var(--card) 45%, var(--bg));border:1px solid var(--line);border-radius:18px;padding:10px;min-height:220px}
    .col.hoy{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
    .col header{display:flex;align-items:center;gap:6px;margin:2px 2px 10px}
    .col .dn{font-weight:800;font-size:1rem;flex:1}
    .col .hoyb{font-size:.62rem;font-weight:800;background:var(--accent);color:#fff;padding:2px 7px;border-radius:99px;text-transform:uppercase}
    .add-dia{border:1px dashed var(--line);background:transparent;border-radius:9px;width:28px;height:28px;font-weight:800;color:var(--muted)}
    .add-dia:hover{border-color:var(--accent);color:var(--accent)}
    .col ol{gap:6px}
    li.card.mini{padding:9px 10px;gap:8px;border-radius:12px}
    li.mini .bar{width:4px}
    li.mini .hm{font-size:.78rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
    li.mini .nombre{font-size:.9rem}
    li.mini .tag{font-size:.6rem;padding:1px 6px}
    li.mini .emoji{font-size:1.15rem;align-self:flex-start}
    li.mini.ahora::after{right:8px;font-size:.55rem}
    .libre-dia{color:var(--muted);text-align:center;padding:16px 0;font-weight:800}
  }
  textarea{width:100%;font:600 .85rem/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;resize:vertical}
  .previa{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:14px;padding:12px;max-height:38vh;overflow:auto}
  .pd b{display:block;font-size:.85rem;margin-bottom:2px}
  .pa{font-size:.85rem;font-weight:700;padding:2px 0}
  .pa span{color:var(--muted);font-variant-numeric:tabular-nums;display:inline-block;min-width:92px}
  .chip.ahora-btn{background:transparent;border-color:var(--accent);color:var(--accent)}
  .ahora-lista{display:flex;flex-direction:column;gap:10px}
  .ap{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .ap:active{transform:scale(.99)}
  .ap-nom{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .ap-nom span{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
  .ap-nom i{margin-left:auto;font-style:normal;color:var(--muted)}
  .ap-act{display:flex;align-items:center;gap:10px;border-left:4px solid;border-radius:10px;padding:8px 10px;margin-bottom:6px}
  .ap-em{font-size:1.4rem}
  .ap-txt{display:flex;flex-direction:column}
  .ap-txt b{font-size:1rem}
  .ap-txt small{color:var(--muted);font-weight:700;font-size:.8rem}
  .ap-libre{color:var(--muted);font-weight:700;padding:6px 2px}
  .ap-sig{color:var(--muted);font-weight:700;font-size:.85rem;margin-top:2px}
  .ap-sig b{color:var(--ink)}
  .cal-cab{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
  .mini-btn{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;font-weight:800;font-size:.78rem;margin-left:6px}
  .cal-lista{display:flex;flex-direction:column;gap:5px;background:var(--bg);border-radius:14px;padding:8px}
  .cal-per{font-weight:800;font-size:.95rem;padding:8px 4px 2px}
  .cal-tipo{display:flex;align-items:center;gap:10px;border:none;background:transparent;padding:10px 6px 4px;font-weight:800;font-size:.85rem;text-align:left;width:100%}
  .cal-tipo small{margin-left:auto;color:var(--muted)}
  .cal-act{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid;border-radius:12px;padding:10px 12px;min-height:52px}
  .ca-em{font-size:1.3rem}
  .ca-txt{display:flex;flex-direction:column;min-width:0}
  .ca-txt b{font-size:.95rem}
  .ca-txt small{color:var(--muted);font-weight:700;font-size:.78rem}
  .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff}
  .ck.on{background:var(--accent);border-color:var(--accent)}
  .ck.on::after{content:"✓";font-weight:800}
  .ck.medio{border-color:var(--accent)}
  .ck.medio::after{content:"–";color:var(--accent);font-weight:800}
  .semnav{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .semnav button{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:42px;height:40px;font-size:1.3rem;font-weight:800}
  .semnav .sn-hoy{font-size:.85rem;padding:0 12px;color:var(--accent);border-color:var(--accent)}
  .sn-txt{flex:1;text-align:center;display:flex;flex-direction:column;line-height:1.15}
  .sn-txt b{font-size:1rem}
  .sn-txt small{font-size:.72rem;color:var(--muted);font-weight:700}
  .col .dn small{color:var(--muted);font-weight:700}
  .aviso-fechas{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.85rem;font-weight:700;margin-top:14px;line-height:1.4}
  .vistas{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:2px 0 10px}
  .vistas button{border:none;background:transparent;border-radius:9px;padding:8px 0;font-weight:800;font-size:.9rem;color:var(--muted)}
  .vistas button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  body.vista-mes .fab, body.vista-ano .fab{display:none !important}
  body.vista-mes .tabs, body.vista-ano .tabs{display:none}
  .mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .mes-h{text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);padding:2px 0}
  .mes-c{position:relative;aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px;gap:4px;min-width:0}
  .mes-c.vacia{border:none;background:transparent}
  .mes-c.finde{background:color-mix(in srgb, var(--card) 60%, var(--bg))}
  .mes-c .num{font-weight:800;font-size:.95rem}
  .mes-c.hoy{border:2px solid var(--accent)}
  .mes-c.hoy .num{color:var(--accent)}
  .mes-c .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
  .mes-c .dots i{width:7px;height:7px;border-radius:50%;display:block}
  .mes-c .dots i.mas{background:none;font-style:normal;font-size:.55rem;line-height:7px;color:var(--muted)}
  .mes-c .cnt{position:absolute;bottom:3px;right:5px;font-size:.55rem;color:var(--muted);font-weight:800}
  .leyenda{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:.8rem;font-weight:700;color:var(--muted)}
  .leyenda span{display:inline-flex;align-items:center;gap:5px}
  .leyenda i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .ano{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .ano-m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
  .ano-t{border:none;background:none;font-weight:800;font-size:.9rem;padding:2px 2px 6px;width:100%;text-align:left}
  .ano-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
  .ano-h{text-align:center;font-size:.55rem;font-weight:800;color:var(--muted)}
  .ano-d{border:none;background:transparent;border-radius:5px;font-size:.62rem;font-weight:700;aspect-ratio:1/1;padding:0;color:var(--ink);font-variant-numeric:tabular-nums}
  .ano-d.finde{color:var(--muted)}
  .ano-d.hoy{outline:2px solid var(--accent);outline-offset:-1px}
  @media (min-width: 640px){ .ano{grid-template-columns:repeat(3,minmax(0,1fr))} .mes-c{aspect-ratio:1/.8} }
  @media (min-width: 1000px){
    .ano{grid-template-columns:repeat(4,minmax(0,1fr))}
    .vistas{max-width:360px}
    .mes{max-width:900px} .mes-c{aspect-ratio:1/.62;align-items:flex-start;padding:6px 8px} .mes-c .dots{justify-content:flex-start} .mes-c .dots i{width:9px;height:9px}
    .ano-d{font-size:.7rem}
  }
  .op.nuevo{color:var(--accent);border:1.5px dashed var(--accent);background:transparent}
</style>
</head>
<body>
<div class="estado" id="estado"></div>
<div class="top">

<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, runTransaction, set, get, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ================= Datos iniciales ================= */
const COLORES = ["#3b6fd8","#0e9fb3","#1f9d6b","#7aa51b","#d98a14","#e0622d","#d23c3c","#d6457a","#8a4fd1","#5b5fc7","#8b6b4a","#7b8090"];
const DIAS = [["L","Lunes"],["M","Martes"],["X","Miércoles"],["J","Jueves"],["V","Viernes"],["S","Sábado"],["D","Domingo"]];
const TEMAS = {
  "Estudio":   ["✏️","📚","📖","📝","➗","🔢","🧮","🔬","🧪","🌍","🗺️","💻","🇬🇧","🇫🇷","🗣️","🏫","🎒","📐"],
  "Música":    ["🎵","🎶","🎸","🎹","🥁","🎻","🎺","🎷","🪈","🎤","🎧","🪗"],
  "Deporte":   ["⚽","🏀","🏐","🎾","🏓","🏸","🏊","🚴","🛹","⛸️","🤸","🎀","🥋","🤺","🧗","🏃","🩰","🏇","⛳","🏄","⛷️","🧘"],
  "Arte":      ["🎨","🖌️","🖍️","✂️","🦢","🧶","🧵","🎭","📸","🎬","🧩","🪁","🐜"],
  "Casa":      ["🚿","🛁","🦷","🛏️","😴","👕","🧹","🧺","🐶","🐱","🪴","🧸","🏠","🚗","🚌"],
  "Comida":    ["🥪","🍎","🍌","🥛","🍪","🍕","🍝","🥗","🍽️","🧃"],
  "Ocio":      ["🎉","🎮","📺","🎲","🃏","🎳","🛝","🌳","🏖️","🎂","🎁","👫","🧑‍🤝‍🧑","⛪"],
  "Salud":     ["🩺","💊","🦷","👓","🧠","❤️"],
  "Otros":     ["⭐","✅","⏰","📅","📌","💡","🔔","❗","❓","🌙","☀️","🌈"]
};
const uid = () => Math.random().toString(36).slice(2,9);
let _n = 0;
const A = (ini,fin,nombre,tipo,emoji) => ({id:"a"+(++_n),ini,fin,nombre,tipo,emoji});
const DEFAULT = {
  rev: 1,
  tipos: [
    {id:"deberes", nombre:"Etxeko lanak", color:"#3b6fd8", emoji:"✏️"},
    {id:"musica",  nombre:"Música",       color:"#8a4fd1", emoji:"🎵"},
    {id:"deporte", nombre:"Deporte",      color:"#1f9d6b", emoji:"⚽"},
    {id:"taller",  nombre:"Taller",       color:"#d6457a", emoji:"🎨"},
    {id:"rutina",  nombre:"Rutina",       color:"#d98a14", emoji:"⏰"},
    {id:"libre",   nombre:"Libre",        color:"#7b8090", emoji:"🎉"}
  ],
  personas: [{
    id:"aldara", nombre:"Aldara", curso:"LH3",
    dias:[
      [A("16:10","16:40","Merienda","rutina","🥪"),A("17:00","17:30","Guitarra","musica","🎸"),A("17:45","18:30","Musika Eibar","musica","🎵"),A("18:30","19:45","Etxeko lanak · Inglés","deberes","🇬🇧"),A("21:00","","Leer","rutina","📖")],
      [A("16:10","17:30","Etxeko lanak · Mate","deberes","➗"),A("17:30","18:30","Origami tailerra","taller","🦢"),A("18:30","19:45","Rítmica","deporte","🎀"),A("19:15","20:00","Ducha","rutina","🚿"),A("21:00","","Leer","rutina","📖")],
      [A("16:10","16:40","Etxeko lanak · Ikastola","deberes","✏️"),A("17:45","18:30","Musika Eibar","musica","🎵"),A("18:30","19:45","Etxeko lanak · Leer euskera","deberes","📚"),A("21:00","","Leer","rutina","📖")],
      [A("16:10","16:40","Skate park","deporte","🛹"),A("18:30","19:45","Rítmica","deporte","🎀"),A("19:15","20:00","Ducha","rutina","🚿"),A("21:00","","Leer","rutina","📖")],
      [A("16:10","16:40","Etxeko lanak · Ikastola","deberes","✏️"),A("17:30","18:30","Txindurri","taller","🐜"),A("18:30","19:45","Libre","libre","🎉")],
      [],[]
    ]
  }]
};

/* ================= Utilidades ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const min = t => { if(!t) return 0; const [h,m]=t.split(":").map(Number); return h*60+m; };
const clone = o => JSON.parse(JSON.stringify(o));
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const nocturna = a => !!(a.fin && min(a.fin) < min(a.ini));
const safeColor =c => /^#[0-9a-f]{6}$/i.test(c) ? c : "#7b8090";
function normaliza(s){
  s = s && typeof s === "object" ? s : clone(DEFAULT);
  s.tipos = Array.isArray(s.tipos) ? s.tipos : [];
  s.personas = Array.isArray(s.personas) ? s.personas : [];
  s.personas.forEach(p=>{
    p.dias = Array.isArray(p.dias) ? p.dias : [];
    for (let i=0;i<7;i++) p.dias[i] = Array.isArray(p.dias[i]) ? p.dias[i] : [];
  });
  return s;
}
function estado(txt, fijo){
  const el = $("estado"); el.textContent = txt; el.classList.add("on");
  clearTimeout(estado.t); if(!fijo) estado.t = setTimeout(()=>el.classList.remove("on"), 2200);
}

/* ================= Estado ================= */
let state = null, cargado = false, editor = false, user = null, db = null;
const now = () => new Date();
const hoyIdx = () => (now().getDay()+6)%7;
const ui = Object.assign({persona:null, dia:hoyIdx()}, ls.get("agenda-ui") || {});
ui.dia = hoyIdx(); // al abrir la app, siempre empieza en hoy
const saveUI = () => ls.set("agenda-ui", ui);
const persona = () => state && (state.personas.find(p=>p.id===ui.persona) || state.personas[0]);
const tipo = id => state.tipos.find(t=>t.id===id) || {id:"", nombre:"Sin tipo", color:"#7b8090", emoji:""};
/* Fechas: semana 0 = la actual; las actividades con «fechas» solo ocurren esos días */
let semana = 0;
const pad2 = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
function lunesDe(off){ const d = now(); d.setHours(0,0,0,0); d.setDate(d.getDate() - hoyIdx() + 7*off); return d; }
function fechaDia(i, off){ const d = lunesDe(off ?? semana); d.setDate(d.getDate()+i); return d; }
const ocurre = (a, fecha) => !Array.isArray(a.fechas) || a.fechas.includes(iso(fecha));
const esHoyVista = i => semana===0 && i===hoyIdx();
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmtCorta = d => `${d.getDate()} ${MESES[d.getMonth()]}`;

/* ================= Pintar ================= */
const mqSemana = window.matchMedia("(min-width: 1000px)");
const modoSemana = () => mqSemana.matches;
mqSemana.addEventListener ? mqSemana.addEventListener("change", ()=>render()) : mqSemana.addListener(()=>render());

function crearTarjeta(a, dia, desdeAyer, compacta){
  const n = now(), nowMin = n.getHours()*60 + n.getMinutes();
  const esHoy = esHoyVista(dia) || (desdeAyer && semana===0 && (dia+1)%7 === hoyIdx());
  const t = tipo(a.tipo), col = safeColor(t.color);
  const li = document.createElement("li"); li.className = "card" + (compacta ? " mini" : "");
  let activa;
  if (desdeAyer) activa = true;
  else if (nocturna(a)) activa = esHoy && nowMin >= min(a.ini);
  else { const fin = a.fin ? min(a.fin) : min(a.ini)+30; activa = esHoy && nowMin>=min(a.ini) && nowMin<fin; }
  if (activa) li.classList.add("ahora");
  const finTxt = a.fin ? esc(a.fin) + (nocturna(a) && !desdeAyer ? " <b class='mas1'>+1</b>" : "") : "";
  if (compacta){
    li.innerHTML = `
      <div class="bar" style="background:${col}"></div>
      <div class="act">
        <div class="hm">${desdeAyer ? "<span class='ayer'>desde ayer · </span>" : ""}${esc(a.ini)}${a.fin ? ` – ${finTxt}` : ""}</div>
        <div class="nombre">${esc(a.nombre)}</div>
        <span class="tag" style="color:${col};background:${col}22">${esc(t.nombre)}${a.fechas?" · 📅":""}</span>
      </div>
      <div class="emoji" aria-hidden="true">${esc(a.emoji || t.emoji)}</div>`;
  } else {
    li.innerHTML = `
      <div class="bar" style="background:${col}"></div>
      <div class="hora">${desdeAyer ? "<span class='ayer'>desde ayer</span>" : ""}${esc(a.ini)}${a.fin?`<span>${finTxt}</span>`:""}</div>
      <div class="act"><div class="nombre">${esc(a.nombre)}</div>
        <span class="tag" style="color:${col};background:${col}22">${esc(t.nombre)}${a.fechas?" · 📅":""}</span></div>
      <div class="emoji" aria-hidden="true">${esc(a.emoji || t.emoji)}</div>`;
  }
  li.title = editor ? "Tocar para editar" : "";
  li.onclick = ()=>{ if(!editor) return; ui.dia = dia; saveUI(); if(!modoSemana()) render(); abrirActividad(a.id); };
  return li;
}

function render(){
  document.body.classList.toggle("editor", editor);
  document.body.classList.toggle("semana-on", modoSemana());
  $("lockBtn").textContent = editor ? "🔓" : "🔒 Editar";
  $("lockBtn").setAttribute("aria-label", editor ? "Modo edición activo" : "Entrar en modo edición");
  if (!state) return;
  const p = persona();
  if (p && ui.persona !== p.id){ ui.persona = p.id; }
  $("nombre").textContent = p ? p.nombre : "Agenda";
  $("curso").textContent = p?.curso || "";
  const cp = $("personas"); cp.innerHTML = "";
  if (state.personas.length){
    const ah = document.createElement("button");
    ah.className = "chip ahora-btn"; ah.textContent = "🕒 Ahora";
    ah.onclick = abrirAhora;
    cp.appendChild(ah);
  }
  state.personas.forEach(x=>{
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = x.nombre || "Sin nombre";
    b.setAttribute("aria-pressed", x.id===p?.id);
    b.onclick = ()=>{ ui.persona = x.id; saveUI(); render(); };
    cp.appendChild(b);
  });
  if (editor){
    const add = document.createElement("button");
    add.className = "chip add"; add.textContent = "＋ Persona";
    add.onclick = ()=>abrirPersona(null);
    cp.appendChild(add);
  }
  const cuerpo = $("cuerpo");
  if (!p){ $("vistas").innerHTML=""; $("semnav").innerHTML=""; $("tabs").innerHTML=""; $("titulo").textContent=""; cuerpo.innerHTML = `<div class="vacio"><div>👤</div>No hay agendas todavía${editor?"<br>Toca «＋ Persona»":""}</div>`; return; }
  const nowMin = now().getHours()*60 + now().getMinutes();
  const ayerDe = d => { const f = fechaDia(d); f.setDate(f.getDate()-1); return p.dias[(d+6)%7].filter(a=>nocturna(a) && nowMin < min(a.fin) && ocurre(a, f)); };
  const delDia = i => p.dias[i].filter(a=>ocurre(a, fechaDia(i)));
  pintarVistas();
  document.body.classList.toggle("vista-mes", vista==="mes");
  document.body.classList.toggle("vista-ano", vista==="ano");
  if (vista==="mes"){ $("tabs").innerHTML = ""; renderMes(p); return; }
  if (vista==="ano"){ $("tabs").innerHTML = ""; renderAno(p); return; }
  pintarSemNav();

  /* ---- PC: semana completa ---- */
  if (modoSemana()){
    $("tabs").innerHTML = ""; $("titulo").textContent = "Semana";
    const g = document.createElement("div"); g.className = "semana";
    DIAS.forEach(([c,nom],i)=>{
      const col = document.createElement("section"); col.className = "col" + (esHoyVista(i) ? " hoy" : "");
      const h = document.createElement("header");
      h.innerHTML = `<span class="dn">${nom} <small>${fechaDia(i).getDate()}</small></span>${esHoyVista(i)?`<span class="hoyb">hoy</span>`:""}`;
      if (editor){
        const add = document.createElement("button"); add.className = "add-dia"; add.textContent = "＋";
        add.title = `Añadir actividad el ${nom.toLowerCase()}`; add.setAttribute("aria-label", add.title);
        add.onclick = ()=>{ ui.dia = i; saveUI(); abrirActividad(null); };
        h.appendChild(add);
      }
      col.appendChild(h);
      const ol = document.createElement("ol");
      if (esHoyVista(i)) ayerDe(i).forEach(a=>ol.appendChild(crearTarjeta(a,(i+6)%7,true,true)));
      delDia(i).forEach(a=>ol.appendChild(crearTarjeta(a,i,false,true)));
      if (!ol.children.length) ol.innerHTML = `<li class="libre-dia">—</li>`;
      col.appendChild(ol);
      g.appendChild(col);
    });
    cuerpo.innerHTML = ""; cuerpo.appendChild(g);
    return;
  }

  /* ---- Móvil / tablet: un día ---- */
  const tabs = $("tabs"); tabs.innerHTML = "";
  DIAS.forEach(([c,n],i)=>{
    const b = document.createElement("button");
    b.className = "tab" + (esHoyVista(i) ? " hoy" : "");
    b.setAttribute("role","tab"); b.setAttribute("aria-selected", i===ui.dia);
    const cnt = delDia(i).length;
    b.innerHTML = `${c}<small>${esHoyVista(i) ? "hoy" : fechaDia(i).getDate()}</small>${cnt?`<span class="n">${cnt}</span>`:""}`;
    b.onclick = ()=>{ ui.dia = i; saveUI(); render(); };
    tabs.appendChild(b);
  });
  $("titulo").textContent = `${DIAS[ui.dia][1]} ${fmtCorta(fechaDia(ui.dia))}`;
  const acts = delDia(ui.dia);
  const ayer = esHoyVista(ui.dia) ? ayerDe(ui.dia) : [];
  if (!acts.length && !ayer.length){ cuerpo.innerHTML = `<div class="vacio"><div>🌤️</div>Nada este día${editor?"<br>Toca «Añadir actividad»":""}</div>`; return; }
  const ol = document.createElement("ol"); ol.className = "dia";
  ayer.forEach(a=>ol.appendChild(crearTarjeta(a,(ui.dia+6)%7,true,false)));
  acts.forEach(a=>ol.appendChild(crearTarjeta(a,ui.dia,false,false)));
  cuerpo.innerHTML = ""; cuerpo.appendChild(ol);
}
setInterval(render, 60000);


/* ================= Vistas: día/semana · mes · año ================= */
let vista = "dia";                // "dia" | "mes" | "ano"
let refMes = null;                // primer día del mes mostrado
let refAno = null;                // año mostrado
const MESES_L = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const idxDe = f => (f.getDay()+6)%7;
const actsEn = (p, f) => p.dias[idxDe(f)].filter(a=>ocurre(a, f));
const mismoDia = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
function irAFecha(f){
  const l = new Date(f); l.setHours(0,0,0,0); l.setDate(l.getDate() - idxDe(l));
  semana = Math.round((l - lunesDe(0)) / (7*864e5));
  ui.dia = idxDe(f); vista = "dia"; saveUI(); render();
  if (semana===0 && ui.dia===hoyIdx()) irAhora(); else window.scrollTo({top:0, behavior:"smooth"});
}
function pintarVistas(){
  const v = $("vistas"); if (!v) return;
  const ops = [["dia", modoSemana() ? "Semana" : "Día"], ["mes","Mes"], ["ano","Año"]];
  v.innerHTML = "";
  ops.forEach(([k,t])=>{
    const b = document.createElement("button"); b.type="button"; b.textContent = t; b.setAttribute("aria-pressed", vista===k);
    b.onclick = ()=>{
      if (k==="mes" && vista!=="mes"){ const f = fechaDia(ui.dia); refMes = new Date(f.getFullYear(), f.getMonth(), 1); }
      if (k==="ano" && vista!=="ano"){ refAno = (refMes || fechaDia(ui.dia)).getFullYear(); }
      vista = k; render(); window.scrollTo({top:0});
    };
    v.appendChild(b);
  });
}
function navSimple(texto, sub, ant, sig, hoyFn){
  const nav = $("semnav");
  nav.innerHTML = `<button type="button" id="semAnt" aria-label="Anterior">‹</button>
    <div class="sn-txt"><b>${texto}</b><small>${sub||""}</small></div>
    ${hoyFn ? `<button type="button" id="semHoy" class="sn-hoy">Hoy</button>` : ""}
    <button type="button" id="semSig" aria-label="Siguiente">›</button>`;
  $("semAnt").onclick = ant; $("semSig").onclick = sig;
  if (hoyFn) $("semHoy").onclick = hoyFn;
}
function renderMes(p){
  const hoy = now();
  if (!refMes) refMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  const esteMes = refMes.getFullYear()===hoy.getFullYear() && refMes.getMonth()===hoy.getMonth();
  navSimple(`${MESES_L[refMes.getMonth()]} ${refMes.getFullYear()}`, esteMes ? "Este mes" : "",
    ()=>{ refMes = new Date(refMes.getFullYear(), refMes.getMonth()-1, 1); render(); },
    ()=>{ refMes = new Date(refMes.getFullYear(), refMes.getMonth()+1, 1); render(); },
    esteMes ? null : ()=>{ refMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1); render(); });
  $("titulo").textContent = "";
  const g = document.createElement("div"); g.className = "mes";
  DIAS.forEach(([c])=>{ const h = document.createElement("div"); h.className = "mes-h"; h.textContent = c; g.appendChild(h); });
  const vacios = idxDe(refMes);
  for (let i=0;i<vacios;i++){ const e = document.createElement("div"); e.className = "mes-c vacia"; g.appendChild(e); }
  const usados = new Map();
  const nDias = new Date(refMes.getFullYear(), refMes.getMonth()+1, 0).getDate();
  for (let d=1; d<=nDias; d++){
    const f = new Date(refMes.getFullYear(), refMes.getMonth(), d);
    const acts = actsEn(p, f);
    const cols = [];
    acts.forEach(a=>{ const t = tipo(a.tipo); const c = safeColor(t.color); usados.set(t.id||"", t); if (!cols.includes(c)) cols.push(c); });
    const b = document.createElement("button"); b.type = "button";
    b.className = "mes-c" + (mismoDia(f, hoy) ? " hoy" : "") + (idxDe(f)>4 ? " finde" : "");
    b.innerHTML = `<span class="num">${d}</span><span class="dots">${cols.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join("")}</span>${acts.length?`<span class="cnt">${acts.length}</span>`:""}`;
    b.setAttribute("aria-label", `${d} de ${MESES_L[refMes.getMonth()].toLowerCase()}: ${acts.length} actividades`);
    b.onclick = ()=>irAFecha(f);
    g.appendChild(b);
  }
  const ley = document.createElement("div"); ley.className = "leyenda";
  usados.forEach(t=>{ const c = safeColor(t.color); ley.innerHTML += `<span><i style="background:${c}"></i>${esc(t.emoji)} ${esc(t.nombre)}</span>`; });
  const cuerpo = $("cuerpo"); cuerpo.innerHTML = ""; cuerpo.appendChild(g);
  if (usados.size) cuerpo.appendChild(ley);
  const nota = document.createElement("p"); nota.className = "nota"; nota.style.marginTop = "10px"; nota.textContent = "Toca un día para ver su detalle.";
  cuerpo.appendChild(nota);
}
function renderAno(p){
  const hoy = now();
  if (!refAno) refAno = hoy.getFullYear();
  // tipos con fechas concretas de esta persona
  const conFechas = new Map();
  p.dias.forEach(l=>l.forEach(a=>{ if (a.fechas){ const t = tipo(a.tipo); conFechas.set(t.id||"", t); } }));
  let total = 0;
  const cont = document.createElement("div"); cont.className = "ano";
  for (let m=0; m<12; m++){
    const box = document.createElement("div"); box.className = "ano-m";
    const cab = document.createElement("button"); cab.type="button"; cab.className = "ano-t"; cab.textContent = MESES_L[m];
    cab.onclick = ()=>{ refMes = new Date(refAno, m, 1); vista = "mes"; render(); window.scrollTo({top:0}); };
    box.appendChild(cab);
    const g = document.createElement("div"); g.className = "ano-g";
    "LMXJVSD".split("").forEach(c=>{ const h = document.createElement("span"); h.className = "ano-h"; h.textContent = c; g.appendChild(h); });
    const ini = new Date(refAno, m, 1);
    for (let i=0;i<idxDe(ini);i++) g.appendChild(document.createElement("span"));
    const nDias = new Date(refAno, m+1, 0).getDate();
    for (let d=1; d<=nDias; d++){
      const f = new Date(refAno, m, d);
      const fe = p.dias[idxDe(f)].filter(a=>a.fechas && ocurre(a, f));
      const s = document.createElement("button"); s.type = "button"; s.className = "ano-d" + (mismoDia(f,hoy) ? " hoy" : "") + (idxDe(f)>4 ? " finde" : "");
      s.textContent = d;

      s.onclick = ()=>irAFecha(f);
      g.appendChild(s);
    }
    box.appendChild(g); cont.appendChild(box);
  }
  navSimple(String(refAno), total ? `${total} días con fechas concretas` : (refAno===hoy.getFullYear() ? "Este año" : ""),
    ()=>{ refAno--; render(); }, ()=>{ refAno++; render(); },
    refAno===hoy.getFullYear() ? null : ()=>{ refAno = hoy.getFullYear(); render(); });
  $("titulo").textContent = "";
  const cuerpo = $("cuerpo"); cuerpo.innerHTML = "";
  if (!conFechas.size){
    cuerpo.innerHTML = `<div class="vacio" style="margin-bottom:12px"><div>📅</div>${esc(p.nombre)} no tiene actividades con fechas concretas.<br><small>Aquí se ven, por ejemplo, los turnos de un calendario laboral importado.</small></div>`;
  } else {

  }

}

/* Teclado: flechas para cambiar de día (vista de un día) */
document.addEventListener("keydown", e=>{
  if (velo.classList.contains("on") || modoSemana() || !state || vista!=="dia") return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")) return;
  if (e.key === "ArrowRight"){ if (ui.dia===6) semana++; ui.dia = (ui.dia+1)%7; saveUI(); render(); }
  else if (e.key === "ArrowLeft"){ if (ui.dia===0) semana--; ui.dia = (ui.dia+6)%7; saveUI(); render(); }
});


/* ================= Guardar (transacción) ================= */
async function cambiar(op){
  if (!editor){ abrirPIN(); return; }
  // Aplicar ya en local para que se vea al instante
  try { op(state); state = normaliza(state); render(); } catch(e){}
  estado("Guardando…", true);
  try{
    await runTransaction(ref(db, "agenda/data"), cur => {
      const s = normaliza(cur ? JSON.parse(cur) : clone(DEFAULT));
      op(s);
      s.rev = (s.rev||0) + 1;
      return JSON.stringify(s);
    });
    estado("Guardado ✓");
  }catch(e){
    console.error(e);
    if (/permission/i.test(String(e.code||e.message))){
      editor = false; render(); estado("El código ha cambiado: vuelve a introducirlo"); abrirPIN();
    } else estado("No se pudo guardar. Revisa la conexión");
  }
}

const velo = $("velo"), sheet = $("sheet");

function cerrar(){ velo.classList.remove("on"); sheet.innerHTML = ""; }
velo.addEventListener("click", e=>{ if(e.target===velo) cerrar(); });

function botonBorrar(btn, accion){
  const txt = btn.textContent;
  btn.onclick = ()=>{
    if (btn.classList.contains("armado")) { accion(); return; }
    btn.classList.add("armado"); btn.textContent = "¿Seguro? Toca otra vez";

function selectorEmoji(cont, valor, onCambio, plegado){
  cont.innerHTML = `
    <div class="icono-actual"><div class="ic"></div><button type="button" class="tog">Cambiar icono</button></div>
    <div class="panel">
      <div class="emoji-sel" style="margin-top:10px"><input type="text" maxlength="8" aria-label="Icono"><span style="color:var(--muted);font-size:.8rem;font-weight:700">o escribe cualquier emoji</span></div>
      <div class="temas"></div><div class="emojis"></div>
    </div>`;
  const ic = cont.querySelector(".ic"), tog = cont.querySelector(".tog"), panel = cont.querySelector(".panel");
  const input = cont.querySelector("input"), temas = cont.querySelector(".temas"), grid = cont.querySelector(".emojis");
  input.value = valor || ""; ic.textContent = valor || "·";
  let abierto = !plegado;
  const mostrar = ()=>{ panel.style.display = abierto ? "" : "none"; tog.textContent = abierto ? "Ocultar iconos" : "Cambiar icono"; };
  tog.onclick = ()=>{ abierto = !abierto; mostrar(); };
  if (!plegado) cont.querySelector(".icono-actual").style.display = "none";
  mostrar();
  let tema = Object.keys(TEMAS).find(k=>TEMAS[k].includes(valor)) || "Estudio";
  const marcar = ()=>{ ic.textContent = input.value || "·"; [...grid.children].forEach(b=>b.setAttribute("aria-pressed", b.textContent===input.value)); };
  const pintarGrid = ()=>{
    [...temas.children].forEach(b=>b.setAttribute("aria-pressed", b.textContent===tema));
    grid.innerHTML = "";
    TEMAS[tema].forEach(e=>{
      const b = document.createElement("button"); b.type="button"; b.textContent=e;
      b.onclick = ()=>{ input.value = e; marcar(); onCambio(e); if (plegado){ abierto=false; mostrar(); } };
      grid.appendChild(b);
    });
    marcar();
  };
  Object.keys(TEMAS).forEach(k=>{
    const b = document.createElement("button"); b.type="button"; b.textContent=k;
    b.onclick = ()=>{ tema=k; pintarGrid(); };
    temas.appendChild(b);
  });
  input.oninput = ()=>{ marcar(); onCambio(input.value.trim()); };
  pintarGrid();
  return { set(v){ input.value = v; marcar(); }, get(){ return input.value.trim(); } };
}

/* ---------- Actividad ---------- */
// Las actividades con fechas importadas existen una vez por día de la semana: se editan/borran juntas
const mismaSerie = (x, a) => !!(x.fechas && a.fechas && x.ini===a.ini && (x.fin||"")===(a.fin||"") && x.nombre===a.nombre && (x.tipo||"")===(a.tipo||""));

/* ---------- Importar / exportar horario ---------- */
const LETRAS = "LMXJVSD";
function leerCodigo(texto){
  const i = texto.indexOf("{"), j = texto.lastIndexOf("}");
  if (i < 0 || j < i) throw new Error("No encuentro el código. Pega el texto completo, empezando por { y terminando por }.");
  let o;
  try { o = JSON.parse(texto.slice(i, j+1)); } catch(e){ throw new Error("El código está incompleto o dañado. Cópialo otra vez entero."); }
  const acts = Array.isArray(o.actividades) ? o.actividades : [];
  if (!acts.length) throw new Error("El código no contiene actividades.");
  const hhmm = /^([01]\d|2[0-3]):[0-5]\d$/;
  const limpias = [];
  acts.forEach((a,k)=>{
    const ini = String(a.ini||"").trim(), fin = String(a.fin||"").trim();
    let fechas = null;
    if (Array.isArray(a.fechas)){
      fechas = [...new Set(a.fechas.map(String).filter(f=>/^\d{4}-\d{2}-\d{2}$/.test(f) && !isNaN(new Date(f+"T12:00"))))].sort();
      if (!fechas.length) fechas = null;
    }
    let dias = [...new Set([...String(a.dias||"").toUpperCase()].map(c=>LETRAS.indexOf(c)).filter(x=>x>=0))];
    if (fechas) dias = [...new Set(fechas.map(f=>(new Date(f+"T12:00").getDay()+6)%7))].sort();
    if (!a.nombre || !hhmm.test(ini) || (fin && !hhmm.test(fin)) || !dias.length || fin===ini)
      throw new Error(`Revisa la actividad ${k+1} («${String(a.nombre||"sin nombre").slice(0,30)}»): falta el nombre, la hora o el día.`);
    limpias.push({nombre:String(a.nombre).slice(0,60), ini, fin, tipo:String(a.tipo||"").slice(0,24), emoji:String(a.emoji||"").slice(0,8), dias, fechas});
  });
  const tipos = (Array.isArray(o.tipos) ? o.tipos : []).filter(t=>t && t.nombre).map(t=>({nombre:String(t.nombre).slice(0,24), color:safeColor(t.color), emoji:String(t.emoji||"").slice(0,8)}));
  return { nombre:String(o.nombre||"").slice(0,30), curso:String(o.curso||"").slice(0,15), tipos, acts:limpias };
}

function codigoDe(p){
  const usados = new Set();
  const acts = [];
  // agrupar actividades idénticas en varios días
  const clave = a => [a.ini,a.fin||"",a.nombre,a.tipo,a.emoji||"",a.fechas?"F":""].join("|");
  const mapa = new Map();
  p.dias.forEach((d,i)=>d.forEach(a=>{
    const k = clave(a);
    if (!mapa.has(k)){ const t = tipo(a.tipo); usados.add(a.tipo); mapa.set(k, {dias:"", ini:a.ini, fin:a.fin||"", nombre:a.nombre, tipo:a.tipo?t.nombre:"", emoji:a.emoji||""}); }
    mapa.get(k).dias += LETRAS[i];
    if (a.fechas) mapa.get(k).fechas = [...(mapa.get(k).fechas||[]), ...a.fechas];
  }));
  mapa.forEach(v=>{ if (v.fechas){ v.fechas = [...new Set(v.fechas)].sort(); } acts.push(v); });
  const tipos = state.tipos.filter(t=>usados.has(t.id)).map(t=>({nombre:t.nombre, color:t.color, emoji:t.emoji}));
  return JSON.stringify({agenda:1, nombre:p.nombre, curso:p.curso||"", tipos, actividades:acts});
}

function estadoAhora(p){
  const n = now(), m = n.getHours()*60 + n.getMinutes(), d = hoyIdx(), ay = (d+6)%7;
  const fHoy = fechaDia(d, 0), fAyer = new Date(fHoy); fAyer.setDate(fAyer.getDate()-1);
  const actuales = [];
  p.dias[ay].forEach(a=>{ if (nocturna(a) && m < min(a.fin) && ocurre(a, fAyer)) actuales.push(a); });
  p.dias[d].filter(a=>ocurre(a, fHoy)).forEach(a=>{
    if (nocturna(a)) { if (m >= min(a.ini)) actuales.push(a); return; }
    const fin = a.fin ? min(a.fin) : min(a.ini)+30;
    if (m >= min(a.ini) && m < fin) actuales.push(a);
  });
  const siguiente = p.dias[d].filter(a=>ocurre(a, fHoy) && min(a.ini) > m && !actuales.includes(a)).sort((x,y)=>min(x.ini)-min(y.ini))[0] || null;
  return { actuales, siguiente };
}

/* ---------- Añadir al calendario (.ics) ---------- */
const VTZ = ["BEGIN:VTIMEZONE","TZID:Europe/Madrid",
  "BEGIN:DAYLIGHT","TZOFFSETFROM:+0100","TZOFFSETTO:+0200","TZNAME:CEST","DTSTART:19700329T020000","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU","END:DAYLIGHT",
  "BEGIN:STANDARD","TZOFFSETFROM:+0200","TZOFFSETTO:+0100","TZNAME:CET","DTSTART:19701025T030000","RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU","END:STANDARD",
  "END:VTIMEZONE"];
const pad = n => String(n).padStart(2,"0");
const icsTxt = s => String(s ?? "").replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
function plegar(linea){
  // Las líneas .ics no deben pasar de 75 bytes
  const enc = new TextEncoder(); const out = []; let actual = "", bytes = 0, limite = 75;
  for (const ch of linea){
    const b = enc.encode(ch).length;
    if (bytes + b > limite){ out.push(actual); actual = " "; bytes = 1; limite = 75; }
    actual += ch; bytes += b;
  }
  out.push(actual); return out.join("\r\n");
}
const fechaLocal = (d, hhmm) => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${hhmm.replace(":","")}00`;
function generarICS(personas, incluir, aviso, hasta){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Agenda semanal//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:" + icsTxt("Agenda · " + personas.map(p=>p.nombre).join(", ")), "X-WR-TIMEZONE:Europe/Madrid", ...VTZ];
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const [ay,am,ad] = hasta.split("-").map(Number);
  const until = `${ay}${pad(am)}${pad(ad)}T225959Z`;
  let n = 0;
  personas.forEach(p=>p.dias.forEach((lista, di)=>lista.forEach(a=>{
    if (!incluir(p, a)) return;
    const t = tipo(a.tipo);
    const titulo = `${a.emoji || t.emoji || ""} ${a.nombre}${personas.length > 1 ? " · " + p.nombre : ""}`.trim();
    const limite = new Date(ay, am-1, ad);
    // fechas de inicio: concretas (calendario laboral) o la próxima de ese día con repetición semanal
    let inicios;
    if (Array.isArray(a.fechas)){
      inicios = a.fechas.map(f=>{ const [y,m,dd]=f.split("-").map(Number); return new Date(y,m-1,dd); })
        .filter(f=>(f.getDay()+6)%7===di && f>=hoy && f<=limite);
    } else {
      const ini = new Date(hoy); ini.setDate(hoy.getDate() + ((di - hoyIdx() + 7) % 7));
      inicios = ini <= limite ? [ini] : [];
    }
    inicios.forEach(ini=>{
      let finHHMM = a.fin, finD = new Date(ini);
      if (!finHHMM){ const m = min(a.ini) + 30; finHHMM = pad(Math.floor(m/60)%24) + ":" + pad(m%60); if (m >= 1440) finD.setDate(finD.getDate()+1); }
      else if (nocturna(a)) finD.setDate(finD.getDate()+1);
      L.push("BEGIN:VEVENT",
        `UID:${p.id}-${a.id}-${di}${a.fechas ? "-" + iso(ini) : ""}@agenda-semanal`,
        `DTSTAMP:${stamp}`,
        `DTSTART;TZID=Europe/Madrid:${fechaLocal(ini, a.ini)}`,
        `DTEND;TZID=Europe/Madrid:${fechaLocal(finD, finHHMM)}`);
      if (!a.fechas) L.push(`RRULE:FREQ=WEEKLY;UNTIL=${until}`);
      L.push("SUMMARY:" + icsTxt(titulo),
        "DESCRIPTION:" + icsTxt(`${p.nombre}${t.id ? " · " + t.nombre : ""}`),
        "CATEGORIES:" + icsTxt(t.nombre));
      if (aviso > 0) L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + icsTxt(titulo), `TRIGGER:-PT${aviso}M`, "END:VALARM");
      L.push("END:VEVENT"); n++;
    });
  })));
  L.push("END:VCALENDAR");
  return { texto: L.map(plegar).join("\r\n") + "\r\n", n };
}

        const cab = document.createElement("button"); cab.type = "button"; cab.className = "cal-tipo";
        const todosDentro = ()=>items.every(v=>!fuera.has(v.k));
        const pintarCab = ()=>{ cab.innerHTML = `<span class="ck ${todosDentro()?"on":items.some(v=>!fuera.has(v.k))?"medio":""}"></span><span style="color:${c}">${esc(t.emoji)} ${esc(t.nombre)}</span><small>${items.length}</small>`; };
        const filas = [];
        cab.onclick = ()=>{ const marcar = !todosDentro(); items.forEach(v=> marcar ? fuera.delete(v.k) : fuera.add(v.k)); filas.forEach(f=>f()); pintarCab(); resumen(); };
        pintarCab(); tw.appendChild(cab);
        items.forEach(v=>{
          const r = document.createElement("button"); r.type = "button"; r.className = "cal-act";
          const pintar = ()=>{ r.innerHTML = `<span class="ck ${fuera.has(v.k)?"":"on"}"></span><span class="ca-em">${esc(v.a.emoji || t.emoji)}</span><span class="ca-txt"><b>${esc(v.a.nombre)}</b><small>${v.dias.map(i=>DL[i]).join(" ")} · ${esc(v.a.ini)}${v.a.fin?"–"+esc(v.a.fin):""}</small></span>`; r.style.borderLeftColor = c; };
          r.onclick = ()=>{ fuera.has(v.k) ? fuera.delete(v.k) : fuera.add(v.k); pintar(); pintarCab(); resumen(); };
          pintar(); filas.push(pintar); tw.appendChild(r);
        });
      });
    });
  }
  $("cTodas").onclick = ()=>{ grupos().forEach(({porTipo})=>porTipo.forEach(it=>it.forEach(v=>fuera.delete(v.k)))); pintarTipos(); resumen(); };
  $("cNinguna").onclick = ()=>{ grupos().forEach(({porTipo})=>porTipo.forEach(it=>it.forEach(v=>fuera.add(v.k)))); pintarTipos(); resumen(); };
  const preparar = ()=>{
    const ps = state.personas.filter(p=>sel.has(p.id));
    return ps.length ? generarICS(ps, (p,a)=>!fuera.has(claveAct(p,a)), aviso, $("cHasta").value || finDeCurso()) : {texto:"", n:0};
  };
  function resumen(){ const {n} = preparar(); $("cRes").textContent = n ? `Se crearán ${n} ${n===1?"evento":"eventos"} en el calendario` : "No hay ninguna actividad marcada"; }
  $("cHasta").onchange = resumen;
  pintarTipos(); resumen();
  const puedeCompartir = (()=>{ try { return !!(navigator.canShare && navigator.canShare({files:[new File(["x"],"a.ics",{type:"text/calendar"})]})); } catch(e){ return false; } })();
  if (puedeCompartir) $("cOk").textContent = "Abrir en el calendario";
  $("cCancel").onclick = cerrar;
  $("cOk").onclick = async ()=>{
    const ps = state.personas.filter(p=>sel.has(p.id));
    if (!ps.length) return $("cErr").textContent = "Elige al menos una persona.";
    const {texto, n} = preparar();
    if (!n) return $("cErr").textContent = "Marca al menos una actividad.";
    ls.set("agenda-cal", {aviso, fueraAct:[...fuera], hasta:$("cHasta").value});
    const nombre = "agenda-" + ps.map(p=>p.nombre).join("-").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9-]+/gi,"").toLowerCase() + ".ics";
    const archivo = new File([texto], nombre, {type:"text/calendar"});
    if (puedeCompartir){
      try { await navigator.share({files:[archivo], title:"Agenda"}); cerrar(); estado("Listo ✓"); return; }
      catch(e){ if (e && e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(archivo);
    const a = document.createElement("a"); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    cerrar(); estado("Calendario descargado ✓");
  };
}

/* ---------- Menú ---------- */
function abrirMenu(){
  const p = persona();
  if (!editor){
    abrir(`<h3>Agenda semanal</h3><div class="menu">
      <button class="btn" id="mPin">🔒 Entrar en modo edición</button>
      <button class="btn" id="mCal">📅 Añadir al calendario</button>
      <button class="btn" id="mCerrar" style="text-align:center">Cerrar</button></div>`);
    $("mPin").onclick = abrirPIN; $("mCerrar").onclick = cerrar; $("mCal").onclick = abrirCalendario; return;
  }
  abrir(`
    <h3>${esc(p?.nombre || "Agenda")}</h3>
    <div class="menu">
      <button class="btn" id="mCal">📅 Añadir al calendario</button>
      <button class="btn" id="mTipos">🏷️ Tipos de actividad</button>
      ${p ? `<button class="btn" id="mEdit">✏️ Cambiar nombre o curso</button>` : ""}
      <button class="btn" id="mNueva">➕ Nueva agenda</button>
      <button class="btn" id="mImp">📥 Importar horario</button>
      ${p ? `<button class="btn" id="mExp">📤 Copiar el horario como código</button>` : ""}
      ${p ? `<button class="btn peligro" id="mDia">🧹 Vaciar el ${esc(DIAS[ui.dia][1].toLowerCase())}</button>` : ""}
      ${p ? `<button class="btn peligro" id="mDel">🗑️ Borrar la agenda de ${esc(p.nombre)}</button>` : ""}
      <button class="btn" id="mSalir">🔒 Salir del modo edición en este móvil</button>
      <button class="btn" id="mCerrar" style="text-align:center">Cerrar</button>
    </div>`);
  $("mTipos").onclick = abrirTipos;
  $("mCal").onclick = abrirCalendario;
  $("mNueva").onclick = ()=>abrirPersona(null);
  $("mImp").onclick = abrirImportar;
  if ($("mExp")) $("mExp").onclick = abrirExportar;
  $("mCerrar").onclick = cerrar;
  $("mSalir").onclick = async ()=>{ try{ await remove(ref(db,"editores/"+user.uid)); }catch(e){} editor=false; render(); cerrar(); estado("Modo lectura"); };
  if (p){
    const pid = p.id, dia = ui.dia;
    $("mEdit").onclick = ()=>abrirPersona(pid);
    botonBorrar($("mDia"), ()=>{ cambiar(s=>{ const x=s.personas.find(q=>q.id===pid); if(x) x.dias[dia]=[]; }); cerrar(); });
    botonBorrar($("mDel"), ()=>{ cambiar(s=>{ s.personas = s.personas.filter(q=>q.id!==pid); }); cerrar(); });
  }
}

/* ---------- PIN ---------- */
function abrirPIN(){
  if (!user){ estado("Conectando… inténtalo en un momento"); return; }
  abrir(`
    <h3>Modo edición</h3>
    <p class="sub">Escribe el código para poder añadir y cambiar actividades en este móvil.</p>
    <form id="f" novalidate>
      <input type="password" id="pin" autocomplete="off" placeholder="Código" inputmode="text">
      <div class="err" id="pinErr"></div>
      <div class="acciones">
        <button type="button" class="btn" id="pinCancel">Cancelar</button>
        <button type="submit" class="btn pri">Entrar</button>
      </div>
    </form>`);
  $("pinCancel").onclick = cerrar;
  $("f").onsubmit = async e=>{
    e.preventDefault();
    const pin = $("pin").value.trim();
    if (!pin) return;
    $("pinErr").textContent = "Comprobando…";
    try{
      await set(ref(db, "editores/"+user.uid), pin);
      editor = true; render(); cerrar(); estado("Modo edición activado ✓");
    }catch(err){
      $("pinErr").textContent = /permission/i.test(String(err.code||err.message)) ? "Código incorrecto." : "No hay conexión. Inténtalo de nuevo.";
    }
  };
  setTimeout(()=>$("pin")?.focus(), 50);
}

$("menuBtn").onclick = abrirMenu;
$("lockBtn").onclick = ()=>{ editor ? abrirMenu() : abrirPIN(); };
$("fab").onclick = ()=>abrirActividad(null);

/* ================= Arranque ================= */
if (!firebaseConfig || !firebaseConfig.databaseURL || /PEGA/.test(JSON.stringify(firebaseConfig))){
  $("cuerpo").innerHTML = `<div class="aviso"><b>Falta configurar Firebase</b>Abre <code>config.js</code> y pega la configuración de tu proyecto de Firebase (incluida <code>databaseURL</code>). Mira la guía <code>GUIA.md</code>.</div>`;
  state = null;
} else {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  const auth = getAuth(app);
  onValue(ref(db, ".info/connected"), s=>{ $("conn").classList.toggle("on", !!s.val()); $("conn").title = s.val() ? "Conectado" : "Sin conexión"; });
  onValue(ref(db, "agenda/data"), snap=>{
    const v = snap.val();
    try { state = normaliza(v ? JSON.parse(v) : clone(DEFAULT)); } catch(e){ state = normaliza(clone(DEFAULT)); }
    const primera = !cargado;
    cargado = true; render();
    if (primera && ui.dia === hoyIdx()) setTimeout(irAhora, 250);
  }, err=>{
    console.error(err);
    $("cuerpo").innerHTML = `<div class="aviso"><b>No se puede leer la agenda</b>Revisa que hayas pegado las reglas de la base de datos (ver <code>GUIA.md</code>).</div>`;
  });
  onAuthStateChanged(auth, async u=>{
    user = u;
    if (!u){ signInAnonymously(auth).catch(e=>{ console.error(e); estado("Activa el acceso anónimo en Firebase", true); }); return; }
    try{ const s = await get(ref(db, "editores/"+u.uid)); editor = s.exists(); }catch(e){ editor = false; }
    render();
  });
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
